spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Dùng dialect H2 cho test
        dialect: org.hibernate.dialect.H2Dialect

app:
  shipping:
    base-fee: 15000
    per-km-fee: 5000
    base-km: 2.0
    max-fee: 50000
