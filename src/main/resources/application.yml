spring:
  datasource:
    url: jdbc:mysql://localhost:3306/food_delivery?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# Tham số phí ship theo quận:
# total-districts   : tổng số quận (1..10)
# same-district-fee : phí cùng quận (gap = 0) (VND)
# per-gap-fee       : phí mỗi đơn vị khoảng cách quận (gap >= 1: gap * per-gap-fee) (VND)
# ---------------------------------------------------------------------------
app:
  shipping:
    total-districts: 10
    same-district-fee: 15000
    per-gap-fee: 15000

server:
  port: 8080
